<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My 365 Days Journey</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:500px;text-align:center;background:#111;padding:30px 20px;border:1px solid #5b171c;border-radius:18px;box-shadow:0 0 25px #300b0b}
.tag{color:#ff303b;font-size:12px;letter-spacing:4px;font-weight:bold}
h1{font-size:30px;margin:18px 0 8px}
.day{color:#ff303b;font-size:clamp(30px,8vw,43px);font-weight:900;margin:28px 0 10px}
.subtitle{color:#aaa;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:30px}
.box{background:#1b1b1b;border:1px solid #3d2020;padding:14px 3px;border-radius:10px}
.num{font-size:clamp(19px,5vw,27px);font-weight:bold;color:#ff303b;font-variant-numeric:tabular-nums}
.label{font-size:10px;color:#aaa;margin-top:8px}
.progress{height:7px;background:#382020;border-radius:9px;margin-top:25px;overflow:hidden}
.fill{height:100%;background:#ff303b;width:0}
.info{display:flex;justify-content:space-between;font-size:12px;margin-top:10px;color:#aaa}
.footer{margin-top:27px;color:#777;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>
<main class="card">
<div class="tag">MY PERSONAL CHALLENGE</div>
<h1>365 DAYS JOURNEY</h1>
<div class="subtitle">DISCIPLINE • FOCUS • GROWTH</div>
<div class="day" id="day">DAY 001 / 365</div>
<div class="subtitle">09 OCT 2026 — 09 OCT 2027</div>
<div class="grid">
<div class="box"><div class="num" id="days">000</div><div class="label">DAYS</div></div>
<div class="box"><div class="num" id="hours">00</div><div class="label">HOURS</div></div>
<div class="box"><div class="num" id="minutes">00</div><div class="label">MINUTES</div></div>
<div class="box"><div class="num" id="seconds">00</div><div class="label">SECONDS</div></div>
</div>
<div class="progress"><div class="fill" id="fill"></div></div>
<div class="info"><span>YEAR PROGRESS</span><b id="percent" style="color:#ff303b">0.00%</b></div>
<div class="subtitle" id="remaining" style="margin-top:18px">Calculating...</div>
<div class="footer">ONE YEAR. ONE JOURNEY. MY LIFE.</div>
</main>
<script>
const start=new Date('2026-10-09T00:00:00+05:30').getTime();
const duration=365*24*60*60*1000;
const pad=n=>String(n).padStart(2,'0');
function update(){
 const now=Date.now();
 const elapsed=Math.max(0,now-start);
 const passed=Math.min(elapsed,duration);
 const total=Math.floor(passed/1000);
 const d=Math.floor(total/86400);
 const h=Math.floor(total%86400/3600);
 const m=Math.floor(total%3600/60);
 const s=total%60;
 document.getElementById('day').textContent=elapsed>=duration?'DAY 365 / 365':'DAY '+String(Math.min(365,Math.floor(elapsed/86400000)+1)).padStart(3,'0')+' / 365';
 document.getElementById('days').textContent=String(d).padStart(3,'0');
 document.getElementById('hours').textContent=pad(h);
 document.getElementById('minutes').textContent=pad(m);
 document.getElementById('seconds').textContent=pad(s);
 const pct=passed/duration*100;
 document.getElementById('percent').textContent=pct.toFixed(4)+'%';
 document.getElementById('fill').style.width=pct+'%';
 const left=Math.max(0,Math.ceil((duration-elapsed)/1000));
 document.getElementById('remaining').textContent=elapsed>=duration?'365-DAY JOURNEY COMPLETED':Math.floor(left/86400)+' days '+pad(Math.floor(left%86400/3600))+' hours '+pad(Math.floor(left%3600/60))+' minutes remaining';
}
update();setInterval(update,1000);
</script>
</body>
</html>
